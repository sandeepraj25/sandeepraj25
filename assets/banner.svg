<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sandeep Raj</title>
  <desc id="desc">B.Tech Computer Science student (2028) building toward Software Development, Backend Engineering and Data Analytics roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1A"/>
      <stop offset="0.55" stop-color="#0A192F"/>
      <stop offset="1" stop-color="#140B2E"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- soft breathing glows -->
    <circle cx="180" cy="60" r="220" fill="url(#glowBlue)">
      <animate attributeName="r" values="200;240;200" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="250" r="240" fill="url(#glowPurple)">
      <animate attributeName="r" values="240;200;240" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- code-bracket motif, right side -->
    <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" fill="#22D3EE" fill-opacity="0.10" font-size="150" font-weight="700">
      <text x="905" y="200">{ }</text>
    </g>

    <!-- terminal prompt label -->
    <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="16">
      <text x="80" y="88" fill="#22D3EE">~/sandeepraj25 <tspan fill="#64748B">$</tspan> <tspan fill="#CBD5E1">whoami</tspan><tspan fill="#22D3EE">▍<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>
    </g>

    <!-- name -->
    <text x="76" y="168" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Sandeep Raj</text>

    <!-- animated underline -->
    <rect x="80" y="188" width="420" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="x" values="80;140;80" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- subtitle -->
    <text x="80" y="228" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">B.Tech Computer Science &amp; Engineering <tspan fill="#475569">·</tspan> Class of 2028</text>

    <!-- focus tags -->
    <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="500">
      <rect x="80" y="248" width="76" height="28" rx="14" fill="#3B82F6" fill-opacity="0.14" stroke="#3B82F6" stroke-opacity="0.55"/>
      <text x="118" y="267" text-anchor="middle" fill="#93C5FD">SDE</text>
      <rect x="166" y="248" width="104" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="218" y="267" text-anchor="middle" fill="#67E8F9">Backend</text>
      <rect x="280" y="248" width="150" height="28" rx="14" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <text x="355" y="267" text-anchor="middle" fill="#C4B5FD">Data Analytics</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#3B82F6" stroke-opacity="0.25"/>
  </g>
</svg>
