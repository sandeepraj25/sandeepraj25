<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">CppHttpd — multithreaded HTTP server in C++17</title><desc id="d">From-scratch HTTP/1.1 server in C++17 with a thread pool, Express-style middleware, a router with path parameters, per-IP rate limiting and a cached static file server. About 64,000 requests per second, 0.23 ms median latency, 77 tests clean under AddressSanitizer and ThreadSanitizer.</desc>
