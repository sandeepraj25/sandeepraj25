  <title id="t">TalentBridge — full-stack job portal</title><desc id="d">Job portal for candidates, recruiters and admins. React and TypeScript front end, Node.js and Express REST API with JWT and role-based access, MySQL schema of 29 tables. Coin spends are atomic using SELECT FOR UPDATE inside transactions; pluggable Razorpay and Cashfree payment adapters.</desc>
