# Draws your real contribution graph as an animated snake and publishes it
# to the `output` branch. The README reads the SVG from there.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#22D3EE&color_dots=#16213A,#1E3A8A,#2563EB,#3B82F6,#22D3EE&color_dot_border=#0B1120

      # The snake SVG is transparent; give it the README's navy background
      # so it blends with the cards above and below in light mode too.
      - name: Add background
        run: sed -i '0,/<svg[^>]*>/s//&<rect x="-100%" y="-100%" width="300%" height="300%" fill="#0B1120"\/>/' dist/snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
